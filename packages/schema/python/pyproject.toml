[project]
name = "questboard-schema"
version = "0.0.0"
description = "Pydantic models generated from packages/schema/schemas"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["questboard_schema"]
