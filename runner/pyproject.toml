[project]
name = "questboard-runner"
version = "0.0.0"
description = "Questboard runner: scheduler, providers, ingest, sanitizer, extractors, engine"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1.8.0",
  "cryptography>=45",
  "en-core-web-md",
  "es-core-news-md",
  "httpx>=0.28.1",
  "keyring>=25.7.0",
  "presidio-analyzer>=2.2",
  "psutil>=7.2.2",
  "pydantic>=2.8,<3",
  "pywebpush>=2.5.0",
  "pyyaml>=6.0.3",
  "questboard-schema",
  "sqlcipher3>=0.6.2",
  "tzdata>=2026.4",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.sources]
questboard-schema = { path = "../packages/schema/python", editable = true }
es-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_md-3.8.0/es_core_news_md-3.8.0-py3-none-any.whl" }
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
