[project]
name = "questboard-runner"
version = "0.0.0"
description = "Questboard runner: scheduler, providers, ingest, sanitizer, extractors, engine"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8,<3",
  "questboard-schema",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.sources]
questboard-schema = { path = "../packages/schema/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
