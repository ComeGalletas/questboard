[package]
name = "questboard-desktop"
version = "0.1.0"
description = "Questboard desktop shell: dashboard window, tray, start at login, deep links"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# generate_context! embeds plugin config as JSON and expects this crate by name.
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
