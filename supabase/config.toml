# Supabase CLI project config. Only settings Questboard depends on are listed; everything
# else uses CLI defaults. Mirror these in the hosted project's dashboard.
project_id = "questboard"

[db]
major_version = 17

[auth]
# Single user: create the account once from the dashboard (or the admin API), then keep
# sign-ups off. The auth.users trigger in the migrations is the database-side backstop.
# Do not also set [auth.email] enable_signup = false: that disables email *logins* too.
enable_signup = false
